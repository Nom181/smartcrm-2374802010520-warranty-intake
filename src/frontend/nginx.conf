server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Chuyển /api/* sang container API (tên dịch vụ "api" trong docker-compose.yml)
  location /api/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
  }

  # React Router: mọi đường dẫn khác trả về index.html
  location / {
    try_files $uri /index.html;
  }
}
